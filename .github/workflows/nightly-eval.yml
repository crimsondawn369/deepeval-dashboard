name: Nightly eval + Pages deploy

# GitHub Actions cron is always UTC and has no DST awareness. These two
# times target 9am/9pm America/New_York during EDT (UTC-4); during EST
# months (roughly Nov-Mar) the runs will land at 8am/8pm local instead.
# Adjust by an hour twice a year if exact local time matters more than a
# fixed UTC schedule.
on:
  schedule:
    - cron: '0 13 * * *'  # ~9:00am America/New_York (EDT)
    - cron: '0 1 * * *'   # ~9:00pm America/New_York (EDT)
  workflow_dispatch: {}

concurrency:
  group: nightly-eval
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-eval-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements/requirements.txt

      - name: Run scheduled eval
        working-directory: dashboard
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_MODEL_NAME: ${{ secrets.AZURE_MODEL_NAME }}
          AZURE_DEPLOYMENT_NAME: ${{ secrets.AZURE_DEPLOYMENT_NAME }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          OPENAI_API_VERSION: ${{ secrets.OPENAI_API_VERSION }}
        run: python3 -c "import asyncio, server; asyncio.run(server.execute_real_run())"

      - name: Commit new run file back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/results/
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Add results from scheduled eval run"
          git push

      - name: Build static Pages site
        working-directory: dashboard
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_MODEL_NAME: ${{ secrets.AZURE_MODEL_NAME }}
          AZURE_DEPLOYMENT_NAME: ${{ secrets.AZURE_DEPLOYMENT_NAME }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          OPENAI_API_VERSION: ${{ secrets.OPENAI_API_VERSION }}
        run: |
          mkdir -p ../_site
          cp index.html script.js styles.css ../_site/
          python3 -c "
          import json, server
          data = server.load_all_results()
          with open('../_site/data.js', 'w') as f:
              f.write(f'const MOCK_DATA = {json.dumps(data)};\n')
          "

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
